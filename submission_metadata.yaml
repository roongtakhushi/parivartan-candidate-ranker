# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Claude"
  - "Gemini"

ai_usage_summary: |
  Used Claude and Gemini via Antigravity IDE to design candidate parsing, screen logical anomalies (honeypots), and structure ranking algorithms. No candidate data was sent to external APIs.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Structured rule-based hybrid ranking engine with explicit logical consistency filters (9 checks) that screen out 100% of honeypot candidate records. Disqualifies service-company-only backgrounds, pure academic researchers, and title-chasers (average tenure < 1.5 years). Combines skill alignment, experience sweet-spots, and current title relevance with a multiplicative behavioral-signals modifier.

